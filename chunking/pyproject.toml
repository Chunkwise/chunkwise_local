[tool.poetry]
name = "chunking"
version = "0.1.0"
description = "Chunking Service"
authors = ["Tyler McGraw <tyler.a.mcgraw@gmail.com>", "Xiran Lu <xlu92427@gmail.com>", "Saurabh Kamboj <skamboj97@gmail.com>", "Ben Stevens <b3nbinoh@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.120.2,<0.121.0"
uvicorn = ">=0.38.0,<0.39.0"
python-dotenv = "^1.2.1"
chunkwise-core = { git = "https://github.com/Chunkwise/chunkwise_core.git", extras = ["chunkers"] }
fuzzywuzzy = "^0.18.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-mock = ">=3.15.1,<4.0.0"
httpx = ">=0.28.1,<0.29.0"
